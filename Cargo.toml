[workspace]
resolver = "3"
members = [
    "tenk",
    "tenk-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/peitaosu/tenk"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "io-std"] }
reqwest = { version = "0.13", features = ["json", "rustls", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
html2text = "0.17"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
comfy-table = "7"
colored = "3"
rmcp = { version = "2.2", features = ["server", "transport-io", "macros"] }
schemars = "1"
rust-i18n = "4"
unicode-width = "0.2"
tokio-test = "0.4"
strum = { version = "0.27", features = ["derive"] }
encoding_rs = "0.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
flate2 = "1"
zip = "2.2"
rand = "0.9"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
chandelier = "0.4"
