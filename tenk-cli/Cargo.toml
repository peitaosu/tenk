[package]
name = "tenk-cli"
version = "0.1.0"
edition = "2024"
authors = ["Tony Su <peitaosu@163.com>"]
description = "10K - CLI for tenk, fetching market data from multiple sources"
license = "MIT"
repository = "https://github.com/peitaosu/tenk"
keywords = ["finance", "stock", "data", "cli", "market"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "tenk"
path = "src/main.rs"

[dependencies]
tenk = { path = "../tenk" }

# Async runtime
tokio = { version = "1.35", features = ["full", "io-std"] }

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Serialization for output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
comfy-table = "7"
colored = "2"

# Error handling
anyhow = "1.0"

# Date/time
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP Server
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }
schemars = "1"
