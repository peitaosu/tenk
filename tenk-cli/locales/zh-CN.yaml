    Tab/1-N  切换面板
    j/k      滚动
    Enter    选择 / 打开对话框
    t        周期：单日 → 5日 → 日/周/月/… → 60分
    ←/→      K 线模式 / 资讯翻页
    v        K 线模式（同 →）
    /        搜索股票（Enter 添加）
    d        删除自选（自选面板）
    r        刷新
    :        命令行
    ?        帮助
    Esc      关闭
    q        退出
