  help_title: "Help"
  help: |
    Tab/1-N  focus panel
    j/k      scroll
    Enter    select / open dialog
    t        cycle period: day → 5d → D/W/M/… → 60m
    ←/→      kline mode / feed page
    v        kline mode (same as →)
    /        search symbol (Enter to add)
    d        remove symbol (watchlist)
    r        refresh
    :        command line
    ?        help
    Esc      close
    q        quit
  hints:
    watchlist: "j/k · / search · d remove · Enter · Tab"
    quote: "j/k scroll · Tab"
    kline: "j/k scroll · ←/→ mode · t period · v · r"
    feed: "j/k · ←/→ · Enter read · r · Tab"
    dialog: "j/k scroll · Esc close"
    search: "j/k · Enter add · Esc close"
    help: "Esc close"
